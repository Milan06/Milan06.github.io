name: Build check

# Deliberately separate from deploy.yml: that workflow publishes to the
# github-pages environment and must only ever run on `main`. This one just
# proves a pull request builds, and touches nothing.

on:
  pull_request:
    branches: [main]

# Superseded runs on the same PR are pointless once a new commit lands.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # .nvmrc is the one place the Node version lives. Astro refuses
          # anything below the >=22.12.0 in package.json, and a runner
          # defaults to 20 — see issue #42.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Type-checks .astro/.ts/.tsx files, and (once #64 lands) content
      # collection schemas, which a plain build doesn't fully cover.
      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build
