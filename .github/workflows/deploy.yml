name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      # withastro/action only takes node-version, not a file, so read the
      # version from .nvmrc — the one place it's set.
      - name: Read Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          # Runners default to Node 20, which Astro refuses (package.json
          # requires >=22.12.0) — without this the build fails outright.
          node-version: ${{ steps.node.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A green deploy only means Pages accepted the upload. This crawls the live
  # site and fails if any page, link or asset doesn't return 200 — see #91.
  # It can't undo a bad deploy, but it turns a silent break into a red run.
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Crawl the live site
        run: node scripts/smoke-test.mjs "${{ needs.deploy.outputs.page_url }}"
